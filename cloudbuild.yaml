steps:
  # The compatibility backend must exist before the new frontend is served.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - |
        test '$PROJECT_ID' = 'leadership-skill-builder-codex'
        test '$BRANCH_NAME' = 'main'
        test ! -f STAGING_ONLY
        test "$$(gcloud functions describe getAccessAccount --gen2 --region=europe-west1 --project=leadership-skill-builder-7aba5 --format='value(state)')" = ACTIVE
  - name: node:22
    entrypoint: bash
    args:
      - -ceu
      - |
        npm ci
        npm --prefix functions ci
        npm run typecheck
        npm test
        npm audit --omit=dev --audit-level=high
        npm --prefix functions audit --omit=dev --audit-level=high
        node scripts/prepare-production.mjs live
  # Build the container image (no API key needed — it's now in Cloud Functions)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skill-builder/skill-builder:$BUILD_ID'
      - '.'

  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'europe-west1-docker.pkg.dev/$PROJECT_ID/skill-builder/skill-builder:$BUILD_ID']

  # Deploy container image to Cloud Run (Production service)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'leadership-skill-builder'
      - '--image'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skill-builder/skill-builder:$BUILD_ID'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

  - name: node:22
    entrypoint: bash
    args:
      - -ceu
      - |
        npm --prefix functions run build
        npx firebase-tools@latest deploy --config firebase.production.json --only functions,firestore:rules --project=leadership-skill-builder-7aba5 --non-interactive

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skill-builder/skill-builder:$BUILD_ID'

options:
  logging: CLOUD_LOGGING_ONLY
